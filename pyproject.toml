[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zhouyi-cli"
version = "0.1.0"
description = "CLI-based Zhouyi casting and interpretation toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "lunardate>=0.2.2",
  "rich>=13.7.1",
  "fastapi>=0.135.1",
  "jinja2>=3.1.3",
  "typer>=0.12.3",
  "textual>=8.2.1",
  "uvicorn>=0.41.0",
  "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "mypy>=1.10.0",
  "httpx>=0.27.0",
]
api = []
web = []

[project.scripts]
zhouyi = "zhouyi.cli.app:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zhouyi = ["data/*.json", "web/templates/*.html", "web/static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["tests/"]

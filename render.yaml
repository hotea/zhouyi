services:
  - type: web
    name: zhouyi-web
    runtime: python
    plan: free
    repo: https://github.com/hotea/zhouyi.git
    branch: main
    buildCommand: pip install -r requirements.txt && pip install -e .
    startCommand: python start_web.py
    envVars:
      - key: ZHOUYI_SESSION_DIR
        value: /tmp/zhouyi-sessions
    healthCheckPath: /

  - type: web
    name: zhouyi-api
    runtime: python
    plan: free
    repo: https://github.com/hotea/zhouyi.git
    branch: main
    buildCommand: pip install -r requirements.txt && pip install -e .
    startCommand: python start_api.py
    envVars:
      - key: ZHOUYI_SESSION_DIR
        value: /tmp/zhouyi-sessions
    healthCheckPath: /health
